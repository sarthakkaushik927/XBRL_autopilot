name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# One deploy at a time: a second one used to `docker rm -f` the container the first had just started (outage
# 2026-11-23 10:41). A newer pending deploy replaces an older pending one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

      - name: Build the Docker image
        run: docker build -t "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest" .

      - name: Push to Docker Hub
        run: docker push "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest"

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    env:
      # the image CI built for that commit (not `latest`, which a later merge may have replaced); a manual run
      # redeploys `latest`
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || 'latest' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      GROQ_API_KEY: ${{ vars.GROQ_API_KEY }}
      PYDANTIC_LOGFIRE_API_KEY: ${{ vars.PYDANTIC_LOGFIRE_API_KEY }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM }}
      QDRANT_API_KEY: ${{ vars.QDRANT_API_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      QDRANT_CLUSTER_ENDPOINT: ${{ vars.QDRANT_CLUSTER_ENDPOINT }}
      XAP_PORT: ${{ vars.XAP_PORT }}
    steps:
      - name: Pull Docker image
        run: |
          echo "deploying ${IMAGE_TAG}"
          sudo docker pull "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:${IMAGE_TAG}"

      - name: Delete Old docker container
        run: |
          sudo docker rm -f "${DOCKER_IMAGE_NAME}-container" || true

      - name: Pruning system df
        run: |
          sudo docker system prune -f
          
      - name: Run Docker Container
        run: |
          # --restart: the backend comes back by itself after a crash or an out-of-memory kill (it stayed down
          # after one on 2026-11-23, until the next deploy)
          sudo docker run -d \
            --restart unless-stopped \
            --name "${DOCKER_IMAGE_NAME}-container" \
            -p "${XAP_PORT}:${XAP_PORT}" \
            --env "XAP_PORT=${XAP_PORT}" \
            --env "GROQ_API_KEY=${GROQ_API_KEY}" \
            --env "GROQ_MODEL=${GROQ_MODEL}" \
            --env "EMBEDDING_MODEL=${EMBEDDING_MODEL}" \
            --env "EMBEDDING_DIM=${EMBEDDING_DIM}" \
            --env "QDRANT_API_KEY=${QDRANT_API_KEY}" \
            --env "QDRANT_CLUSTER_ENDPOINT=${QDRANT_CLUSTER_ENDPOINT}" \
            --env "SERVICE_NAME=${SERVICE_NAME}" \
            --env "PYDANTIC_LOGFIRE_API_KEY=${PYDANTIC_LOGFIRE_API_KEY}" \
            "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest"

  # Each installer is built on its own OS. electron-builder's NSIS target runs the installer under Wine to make the
  # uninstaller, and the Ubuntu runner has no Wine ("spawn wine ENOENT", 2026-11-23), so the .exe builds on Windows.
  build-desktop-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      XAP_API_URL: ${{ vars.XAP_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system dependencies (AppImage support)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install dependencies (make install)
        run: make install

      - name: Build Linux app (.deb & .AppImage)
        run: make build-app-linux

      - name: Keep the Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  build-desktop-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    env:
      XAP_API_URL: ${{ vars.XAP_API_URL }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install make
        run: command -v make || choco install make -y --no-progress

      - name: Install dependencies (make install)
        run: make install

      - name: Build Windows app (.exe)
        run: make build-app-windows

      - name: Keep the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist/*.exe
          if-no-files-found: error

  release-desktop-app:
    needs: [build-desktop-linux, build-desktop-windows]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Verify build artifacts
        run: |
          echo "Generated artifacts in dist/:"
          ls -lh dist/
          ls dist/*.exe dist/*.AppImage dist/*.deb

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Upload installers to AWS S3
        run: |
          # Read version from ui/package.json
          VERSION=$(node -p "require('./ui/package.json').version")
          echo "Package version: ${VERSION}"

          # If triggered by a git tag (e.g. v0.1.0), use the tag name; otherwise v${VERSION}
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION}"
          fi

          echo "Uploading artifacts to s3://${AWS_S3_BUCKET}/releases/${RELEASE_TAG}/"
          aws s3 cp dist/ "s3://${AWS_S3_BUCKET}/releases/${RELEASE_TAG}/" \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "*.AppImage" \
            --include "*.deb"

          echo "Updating latest release in s3://${AWS_S3_BUCKET}/releases/latest/"
          aws s3 cp dist/ "s3://${AWS_S3_BUCKET}/releases/latest/" \
            --recursive \
            --exclude "*" \
            --include "*.exe" \
            --include "*.AppImage" \
            --include "*.deb"

          echo "Upload complete! S3 contents:"
          aws s3 ls "s3://${AWS_S3_BUCKET}/releases/${RELEASE_TAG}/"

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
