name: CI Pipeline

# Backend tests on every PR to main (until 2026-11-23 they ran only after the merge), the image built and pushed only
# for main. The tests need no keys (forks' PRs get no vars/secrets).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # a newer push to a PR replaces its running check; main's runs all finish (each one's image is deployed)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ vars.GROQ_API_KEY }}
      PYDANTIC_LOGFIRE_API_KEY: ${{ vars.PYDANTIC_LOGFIRE_API_KEY }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM }}
      QDRANT_API_KEY: ${{ vars.QDRANT_API_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      QDRANT_CLUSTER_ENDPOINT: ${{ vars.QDRANT_CLUSTER_ENDPOINT }}
      XAP_PORT: ${{ vars.XAP_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest -v -n=8

  build:
    needs: test
    # only main's image is built and pushed (CD deploys it); a PR or a manual run on another branch never is
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

      # tagged with the commit too: CD deploys exactly this commit's image, not whatever `latest` is by then
      # (two merges in a row used to race on `latest`)
      - name: Build the Docker image
        run: docker build -t "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:${GITHUB_SHA}" -t "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest" .

      - name: Push to Docker Hub
        run: |
          docker push "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest"